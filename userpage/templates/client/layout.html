<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} {% endblock %}</title>
    <style>
        .main{
          min-height: 60vh;
        }
        :focus-visible {
          outline: 3px solid #0d6efd;
          outline-offset: 2px;
        }
        .card-img-top {
          object-fit: cover;
        }
        @media (prefers-reduced-motion: reduce) {
          *, *::before, *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
            scroll-behavior: auto !important;
          }
        }
    </style>

    <!-- adding favicon -->
    <link rel="shortcut icon" href="https://thumbs.dreamstime.com/b/hand-book-logo-illustration-art-background-43965136.jpg" type="image/x-icon">

    <!-- bootstrap css cdn link  -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <a class="visually-hidden-focusable" href="#main-content">Skip to main content</a>
    {% include 'client/includes/navbar.html' %}

    <main id="main-content" class="main flex-fill">
        {% block content %} 
        
        {% endblock %}
    </main>

    {% include 'client/includes/footer.html' %}

    <!-- bootstrap js cdn link  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
