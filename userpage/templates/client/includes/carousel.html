<!-- carousel start  -->
<div id="carouselExampleCaptions" class="carousel slide" aria-label="Featured bookstore highlights">
    <style>
      #carouselExampleCaptions .carousel-img { height: 300px; object-fit: cover; }
      #carouselExampleCaptions .carousel-caption { text-shadow: 0 1px 8px rgba(0,0,0,.7); }
      @media (min-width: 768px) {
        #carouselExampleCaptions .carousel-img { height: 420px; }
      }
    </style>
    <div class="carousel-indicators">
      <button
        type="button"
        data-bs-target="#carouselExampleCaptions"
        data-bs-slide-to="0"
        class="active"
        aria-current="true"
        aria-label="Slide 1: New arrivals every week"
      ></button>
      <button
        type="button"
        data-bs-target="#carouselExampleCaptions"
        data-bs-slide-to="1"
        aria-label="Slide 2: Gifts for every reader"
      ></button>
      <button
        type="button"
        data-bs-target="#carouselExampleCaptions"
        data-bs-slide-to="2"
        aria-label="Slide 3: Cash on Delivery across Nepal"
      ></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img
          src="https://images.unsplash.com/photo-1495446815901-a7297e633e8d?q=70&w=1600&auto=format&fit=crop"
          class="d-block w-100 carousel-img"
          alt="Shelves of new arrivals at BookStore"
          fetchpriority="high"
          decoding="async"
        />
        <div class="carousel-caption d-block">
          <p class="h5 fw-bold mb-1">New arrivals every week</p>
          <p class="mb-0 d-none d-sm-block">Fresh Nepali and international titles, shelved daily.</p>
        </div>
      </div>
      <div class="carousel-item">
        <img
          src="https://images.unsplash.com/photo-1550399105-c4db5fb85c18?q=70&w=1600&auto=format&fit=crop"
          class="d-block w-100 carousel-img"
          alt="Stack of books to read and gift"
          loading="lazy"
          decoding="async"
        />
        <div class="carousel-caption d-block">
          <p class="h5 fw-bold mb-1">Gifts for every reader</p>
          <p class="mb-0 d-none d-sm-block">From Muna Madan to modern bestsellers.</p>
        </div>
      </div>
      <div class="carousel-item">
        <img
          src="https://images.unsplash.com/photo-1526285759904-71d1170ed2ac?w=1200&auto=format&fit=crop&q=65"
          class="d-block w-100 carousel-img"
          alt="Open book inviting an afternoon read"
          loading="lazy"
          decoding="async"
        />
        <div class="carousel-caption d-block">
          <p class="h5 fw-bold mb-1">Cash on Delivery across Nepal</p>
          <p class="mb-0 d-none d-sm-block">Order online, pay at your doorstep.</p>
        </div>
      </div>
    </div>
    <button
      class="carousel-control-prev"
      type="button"
      data-bs-target="#carouselExampleCaptions"
      data-bs-slide="prev"
    >
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button
      class="carousel-control-next"
      type="button"
      data-bs-target="#carouselExampleCaptions"
      data-bs-slide="next"
    >
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
  <!-- carousel end  -->
